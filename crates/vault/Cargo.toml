[package]
name = "vault"
version = "0.16.25"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = "0.11"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1.9"
base32 = "0.5"
rand = "0.10.2"
subtle = "2.6"
blake3 = "1.8"

[lints]
workspace = true
