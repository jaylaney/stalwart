[package]
name = "tests"
version = "0.16.27"
edition = "2024"

[features]
#default = ["sqlite", "postgres", "mysql", "rocks", "s3", "redis", "nats", "azure", "foundationdb"]
#default = ["sqlite", "postgres", "mysql", "rocks", "s3", "redis", "foundationdb"]
default = ["rocks", "sqlite"]
sqlite = ["store/sqlite", "directory/sqlite"]
foundationdb = ["store/foundation", "common/foundation"]
postgres = ["store/postgres", "directory/postgres"]
mysql = ["store/mysql", "directory/mysql"]
rocks = ["store/rocks"]
s3 = ["store/s3"]
redis = ["store/redis", "coordinator/redis"]
nats = ["coordinator/nats"]
kafka = ["coordinator/kafka"]
azure = ["store/azure"]

[dev-dependencies]
store = { path = "../crates/store", features = ["test_mode", "enterprise"] }
nlp = { path = "../crates/nlp" }
directory = { path = "../crates/directory", features = ["enterprise"] }
coordinator = { path = "../crates/coordinator", features = ["enterprise"] }
jmap = { path = "../crates/jmap", features = ["test_mode", "enterprise"] }
jmap_proto = { path = "../crates/jmap-proto" }
imap = { path = "../crates/imap" }
imap_proto = { path = "../crates/imap-proto" }
types = { path = "../crates/types" }
dav = { path = "../crates/dav", features = ["test_mode"] }
dav-proto = { path = "../crates/dav-proto" }
calcard = { path = "../crates/calcard", features = ["rkyv"] }
groupware = { path = "../crates/groupware", features = ["test_mode"] }
http = { path = "../crates/http", features = ["test_mode", "enterprise"] }
http_proto = { path = "../crates/http-proto" }
services = { path = "../crates/services", features = ["test_mode", "enterprise"] }
pop3 = { path = "../crates/pop3" }
smtp = { path = "../crates/smtp", features = ["test_mode", "enterprise"] }
common = { path = "../crates/common", features = ["test_mode", "enterprise"] }
registry = { path = "../crates/registry" }
vault = { path = "../crates/vault", features = ["test_mode"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
email = { path = "../crates/email", features = ["test_mode", "enterprise"] }
spam-filter = { path = "../crates/spam-filter", features = ["test_mode", "enterprise"] }
trc = { path = "../crates/trc", features = ["enterprise"] }
managesieve = { path = "../crates/managesieve", features = ["enterprise"] }
smtp-proto = { path = "../crates/smtp-proto" }
smtp-report = { path = "../crates/smtp-report" }
mail-auth = { version = "0.14", features = ["test"] }
mail-parser = { version = "1.0", features = ["full_encoding"] }
mail-builder = "2.0"
sieve-rs = { path = "../crates/sieve" }
utils = { path = "../crates/utils", features = ["test_mode"] }
jmap-client = { version = "0.4", features = ["websockets", "debug", "async"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1" }
csv = "1.4"
rayon = { version = "1.12.0" }
flate2 = { version = "1.1.10", features = ["zlib"], default-features = false }
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "http2", "form"]}
bytes = "1.12.1"
futures = "0.3"
ece = "2.3"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
base64 = "0.23"
ahash = { version = "0.8" }
serial_test = "4.0.1"
chrono = "0.4"
aws-lc-rs = { version = "1" }
biscuit = "0.8.0"
form_urlencoded = "1.2.2"
rkyv.workspace = true
quick-xml = "0.42"
jmap-tools = { path = "../crates/jmap-tools" }
dns-update = { version = "0.6", features = ["test_provider"] }
x509-parser = "0.18"
rcgen = "0.14"
sha2 = "0.11"
time = "0.3"
testcontainers = { version = "0.28", features = ["reusable-containers"] }
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls"] }

[target.'cfg(not(any(target_env = "msvc", target_os = "freebsd")))'.dependencies]
tikv-jemallocator = "0.7"

[lints]
workspace = true
