# Temporary qualification replay of the pinned attempt's immutable producer artifacts.
name: Retention Report Replay
'on':
  push:
    branches:
    - codex/retention-report-replay
permissions:
  contents: read
env:
  UNIT_TEST_FEATURES: common/test_mode common/enterprise coordinator/enterprise dav/test_mode directory/enterprise directory/sqlite dns-update/test_provider email/test_mode email/enterprise groupware/test_mode jmap/test_mode jmap/enterprise managesieve/enterprise services/test_mode services/enterprise smtp/test_mode smtp/enterprise spam-filter/test_mode spam-filter/enterprise store/test_mode store/enterprise store/rocks store/sqlite trc/enterprise utils/test_mode vault/test_mode
  SOURCE_SHA: 9b966c97ff291fbc45aa1eeca888a6d2f6186e03
  SOURCE_RUN_ID: '43757810802'
  SOURCE_RUN_ATTEMPT: '1'
jobs:
  replay-listings:
    name: Replay · Capture Retention Test Listings
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      receipt-artifact-id: "${{ steps.receipt.outputs.artifact-id }}"
    env:
      STORE: RocksDb
      RUST_MIN_STACK: '16777216'
      RUSTUP_TOOLCHAIN: 1.99.1
      RETENTION_TIMEOUT_MINUTES: '100'
      RETENTION_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: "/mnt/listing-target"
      CARGO_HOME: "/mnt/retention-ci/.cargo"
      CARGO_TERM_COLOR: never
      GIT_OPTIONAL_LOCKS: '0'
      GATES: "/mnt/gates"
      TMPDIR: "/mnt/gates/tmp"
    steps:
    - name: Set the work deadline and prepare retention directories
      id: prepare
      shell: bash
      run: |
        # Leave the final 12 minutes for settlement, diagnostics and bounded uploads.
        printf 'RETENTION_DEADLINE_EPOCH=%s\n' \
          "$(( $(date +%s) + (RETENTION_TIMEOUT_MINUTES - 12) * 60 ))" >> "$GITHUB_ENV"
        sudo mkdir -p "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
        sudo chown "$(id -u):$(id -g)" "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
        df -h "$GATES"
    - name: Checkout the replay definition
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Stage corrected evidence module outside the pinned tree
      shell: bash
      run: cp scripts/tests/retention_evidence.py "$RUNNER_TEMP/retention_evidence.py"
    - name: Checkout exact source revision
      uses: actions/checkout@v7
      with:
        ref: "${{ env.SOURCE_SHA }}"
        persist-credentials: false
    - name: Verify the pinned source tree
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git diff --exit-code HEAD --
    - name: Install pinned tools
      id: tools
      shell: bash
      run: bash scripts/tests/retention_ci_setup.sh install-tools ordinary
    - name: Normalize checkout mtimes
      id: normalize
      shell: bash
      run: python3 -I scripts/tests/retention_artifacts.py normalize-checkout
    - name: Fetch and materialize dependencies
      id: fetch
      shell: bash
      run: bash scripts/tests/retention_ci_setup.sh fetch
    - name: Capture all CI step listings
      id: capture
      shell: bash
      run: |
        time env GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
          python3 -I scripts/tests/capture_listings.py --out "$GATES/listings" \
          --deadline-epoch "$RETENTION_DEADLINE_EPOCH"
    - name: Stage listing evidence
      id: stage
      if: "${{ !cancelled() }}"
      timeout-minutes: 2
      shell: bash
      env:
        CAPTURE_OUTCOME: "${{ steps.capture.outcome }}"
      run: |
        git diff --exit-code HEAD --
        env GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
          python3 -I -B - "$RUNNER_TEMP/retention_evidence.py" \
            scripts/tests/retention_artifacts.py stage --kind listings \
            --producer listings --status "$CAPTURE_OUTCOME" \
            --source "$GATES/listings" --out "$GATES/evidence" <<'PY'
        import importlib.util
        from pathlib import Path
        import runpy
        import sys

        module_path, command, *args = sys.argv[1:]
        sys.path.insert(0, str(Path(command).resolve().parent))
        spec = importlib.util.spec_from_file_location("retention_evidence", module_path)
        module = importlib.util.module_from_spec(spec)
        sys.modules[spec.name] = module
        spec.loader.exec_module(module)
        sys.argv = [command, *args]
        runpy.run_path(command, run_name="__main__")
        PY
    - name: Upload listing evidence
      id: receipt
      if: "${{ !cancelled() && steps.stage.outcome == 'success' }}"
      timeout-minutes: 4
      uses: actions/upload-artifact@v7.0.1
      with:
        name: retention-replay-listings-${{ github.run_attempt }}
        path: "${{ env.GATES }}/evidence/"
        if-no-files-found: error
        retention-days: 1
    - name: Retain sanitized listing receipt
      if: "${{ !cancelled() && steps.stage.outcome == 'success' }}"
      timeout-minutes: 2
      uses: actions/upload-artifact@v7.0.1
      with:
        name: retention-replay-listings-diagnostics-${{ github.run_attempt }}
        path: "${{ env.GATES }}/evidence/receipt.json"
        if-no-files-found: ignore
        retention-days: 7
  replay-gates:
    name: Replay · Test Retention Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      STORE: RocksDb
      RUST_MIN_STACK: '16777216'
      RUSTUP_TOOLCHAIN: 1.99.1
      RETENTION_TIMEOUT_MINUTES: '100'
      RETENTION_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: "/mnt/target"
      CARGO_HOME: "/mnt/retention-ci/.cargo"
      CARGO_TERM_COLOR: never
      GIT_OPTIONAL_LOCKS: '0'
      GATES: "/mnt/gates"
      TMPDIR: "/mnt/gates/tmp"
    steps:
    - name: Set the work deadline and prepare retention directories
      id: prepare
      shell: bash
      run: |
        # Leave the final 12 minutes for settlement, diagnostics and bounded uploads.
        printf 'RETENTION_DEADLINE_EPOCH=%s\n' \
          "$(( $(date +%s) + (RETENTION_TIMEOUT_MINUTES - 12) * 60 ))" >> "$GITHUB_ENV"
        sudo mkdir -p "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
        sudo chown "$(id -u):$(id -g)" "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
        df -h "$GATES"
    - name: Checkout exact source revision
      uses: actions/checkout@v7
      with:
        ref: "${{ env.SOURCE_SHA }}"
        persist-credentials: false
    - name: Verify the pinned source tree
      shell: bash
      run: |
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git diff --exit-code HEAD --
    - name: Install pinned coverage tools
      id: tools
      shell: bash
      run: bash scripts/tests/retention_ci_setup.sh install-tools instrumented
    - name: Normalize checkout mtimes
      id: normalize
      shell: bash
      run: python3 -I scripts/tests/retention_artifacts.py normalize-checkout
    - name: Validate selected artifact IDs
      id: artifact-ids
      if: "${{ !cancelled() }}"
      shell: bash
      env:
        SNAPSHOT_ID: '14179413511'
        SHORT_ID: '14180033696'
        ZA_ROCKS_ID: '14181162028'
        ZA_FILESYSTEM_ID: '14180804426'
        LISTINGS_ID: "${{ needs.replay-listings.outputs.receipt-artifact-id }}"
      run: |
        remaining=$((RETENTION_DEADLINE_EPOCH - $(date +%s)))
        if (( remaining < 41 * 60 )); then
          printf '%s\n' 'Insufficient work time for the selected artifact downloads' >&2
          exit 1
        fi
        check_id() {
          if [[ "$2" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s=true\n' "$1" >> "$GITHUB_OUTPUT"
          else
            printf 'Missing or invalid %s artifact ID. Source artifacts must still be available.\n' "$1"
            bad=1
          fi
        }
        bad=0
        check_id snapshot "$SNAPSHOT_ID"
        check_id short "$SHORT_ID"
        check_id za-rocks "$ZA_ROCKS_ID"
        check_id za-filesystem "$ZA_FILESYSTEM_ID"
        check_id listings "$LISTINGS_ID"
        exit "$bad"
    - name: Download short evidence
      id: download-short
      timeout-minutes: 5
      if: "${{ !cancelled() && steps.artifact-ids.outputs.short == 'true' }}"
      uses: actions/download-artifact@v8
      with:
        artifact-ids: '14180033696'
        path: "/mnt/gates/inputs/short"
        digest-mismatch: error
        github-token: "${{ github.token }}"
        repository: "${{ github.repository }}"
        run-id: "${{ env.SOURCE_RUN_ID }}"
    - name: Download za-rocks evidence
      id: download-za-rocks
      timeout-minutes: 5
      if: "${{ !cancelled() && steps.artifact-ids.outputs.za-rocks == 'true' }}"
      uses: actions/download-artifact@v8
      with:
        artifact-ids: '14181162028'
        path: "/mnt/gates/inputs/za-rocks"
        digest-mismatch: error
        github-token: "${{ github.token }}"
        repository: "${{ github.repository }}"
        run-id: "${{ env.SOURCE_RUN_ID }}"
    - name: Download za-filesystem evidence
      id: download-za-filesystem
      timeout-minutes: 5
      if: "${{ !cancelled() && steps.artifact-ids.outputs.za-filesystem == 'true' }}"
      uses: actions/download-artifact@v8
      with:
        artifact-ids: '14180804426'
        path: "/mnt/gates/inputs/za-filesystem"
        digest-mismatch: error
        github-token: "${{ github.token }}"
        repository: "${{ github.repository }}"
        run-id: "${{ env.SOURCE_RUN_ID }}"
    - name: Download listings evidence
      id: download-listings
      timeout-minutes: 5
      if: "${{ !cancelled() && steps.artifact-ids.outputs.listings == 'true' }}"
      uses: actions/download-artifact@v8
      with:
        artifact-ids: "${{ needs.replay-listings.outputs.receipt-artifact-id }}"
        path: "/mnt/gates/inputs/listings"
        digest-mismatch: error
    - name: Download the selected build snapshot
      if: "${{ !cancelled() && steps.artifact-ids.outputs.snapshot == 'true' }}"
      uses: actions/download-artifact@v8
      with:
        artifact-ids: '14179413511'
        path: "/mnt/gates/snapshot"
        digest-mismatch: error
        github-token: "${{ github.token }}"
        repository: "${{ github.repository }}"
        run-id: "${{ env.SOURCE_RUN_ID }}"
      id: snapshot-download
      timeout-minutes: 20
    - name: Restore the instrumented build
      id: unpack
      if: "${{ !cancelled() && steps.snapshot-download.outcome == 'success' && steps.normalize.outcome == 'success' }}"
      shell: bash
      run: |
        printf 'Downloaded build snapshot bytes: %s\n' \
          "$(stat -c '%s' "$GATES/snapshot/snapshot.tar.zst")" | tee -a "$GITHUB_STEP_SUMMARY"
        time bash scripts/tests/retention_ci_setup.sh within-budget \
          python3 -I scripts/tests/retention_artifacts.py unpack-build \
          --archive "$GATES/snapshot/snapshot.tar.zst" --target "$CARGO_TARGET_DIR" \
          --manifest-out "$GATES/build.json"
        printf 'Expanded build bytes: %s\n' "$(du -sb "$CARGO_TARGET_DIR" | cut -f1)" \
          | tee -a "$GITHUB_STEP_SUMMARY"
        df -h "$GATES"
    - name: Fetch and materialize dependencies
      id: fetch
      shell: bash
      run: bash scripts/tests/retention_ci_setup.sh fetch
    - name: Collect retention evidence
      id: collect
      if: "${{ !cancelled() && steps.unpack.outcome == 'success' && steps.download-short.outcome == 'success' && steps.download-za-rocks.outcome == 'success' && steps.download-za-filesystem.outcome == 'success' && steps.download-listings.outcome == 'success' }}"
      shell: bash
      env:
        SNAPSHOT_ID: '14179413511'
      run: |
        status=0
        time bash scripts/tests/retention_ci_setup.sh within-budget \
          env GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
            python3 -I scripts/tests/retention_artifacts.py collect \
              --inputs "$GATES/inputs" --snapshot-artifact-id "$SNAPSHOT_ID" \
              --build-manifest "$GATES/build.json" --out "$GATES/reports" || status=$?
        printf 'code=%s\n' "$status" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Prepare sources for reports
      id: sources
      if: "${{ !cancelled() && (steps.collect.outputs.code == '0' || steps.collect.outputs.code == '1') }}"
      shell: bash
      run: |
        mkdir -p "$GATES/reports/src"
        bash scripts/tests/retention_ci_setup.sh within-budget git archive HEAD tests crates | \
          bash scripts/tests/retention_ci_setup.sh within-budget tar -x -C "$GATES/reports/src"
    - name: Merge validated profiles
      id: merge
      if: "${{ !cancelled() && (steps.collect.outputs.code == '0' || steps.collect.outputs.code == '1') && steps.fetch.outcome == 'success' }}"
      shell: bash
      run: |
        status=0
        time env GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
          python3 -I scripts/tests/coverage_net.py --merge-only \
          --out "$GATES/reports/net" --build-manifest "$GATES/build.json" \
          --deadline-epoch "$RETENTION_DEADLINE_EPOCH" || status=$?
        if [[ -s "$GATES/reports/net/merged.json" ]]; then
          printf 'available=true\n' >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
    - name: Executed functions
      id: functions
      if: "${{ !cancelled() && steps.sources.outcome == 'success' }}"
      shell: bash
      run: |
        bash scripts/tests/retention_ci_setup.sh within-budget \
          python3 -I tests/qualification/tools/strict_rule.py functions \
          --exports "$GATES/reports/net/steps" --sources "$GATES/reports/src" \
          --out "$GATES/reports/functions.json" 2>&1 | tee "$GATES/reports/functions.log"
    - name: Inventory gate
      id: inventory
      if: "${{ !cancelled() && steps.functions.outcome == 'success' }}"
      shell: bash
      run: |
        bash scripts/tests/retention_ci_setup.sh within-budget \
          python3 -I scripts/tests/check_test_inventory.py \
          --baseline tests/qualification/baseline-0.16.27.json \
          --dispositions tests/qualification/dispositions.json \
          --listing "$GATES/reports/listings/list" --ignored-listing "$GATES/reports/listings/ign" \
          --executed "$GATES/reports/functions.json" 2>&1 | tee "$GATES/reports/inventory.out"
    - name: Coverage gate
      id: coverage
      if: "${{ !cancelled() && steps.sources.outcome == 'success' && steps.merge.outputs.available == 'true' }}"
      shell: bash
      run: |
        bash scripts/tests/retention_ci_setup.sh within-budget \
          python3 -I scripts/tests/check_coverage.py \
          --baseline tests/qualification/baseline-0.16.27.json \
          --dispositions tests/qualification/dispositions.json \
          --merged "$GATES/reports/net/merged.json" --sources "$GATES/reports/src" \
          --out "$GATES/reports/coverage.json" 2>&1 | tee "$GATES/reports/coverage.out"
    - name: Sanitize gate diagnostics
      id: sanitize
      if: "${{ !cancelled() }}"
      timeout-minutes: 2
      shell: bash
      run: |
        bash scripts/tests/retention_ci_setup.sh stage-logs "$RUNNER_TEMP/gates-receipt" \
          "$GATES/reports/inventory.out" "$GATES/reports/coverage.out" \
          "$GATES/reports/functions.log" "$GATES/reports/collection.json" \
          "$GATES/reports/net/logs/merged.export.log" "$GATES/reports/net/merge.json"
        grep -h "^## exit\|^# config" "$GATES"/reports/listings/list/*.txt \
          "$GATES"/reports/listings/ign/*.txt \
          > "$RUNNER_TEMP/gates-receipt/listing-exits.txt" 2>/dev/null || true
    - name: Retain sanitized gate diagnostics
      if: "${{ !cancelled() && steps.sanitize.outcome == 'success' }}"
      timeout-minutes: 4
      uses: actions/upload-artifact@v7.0.1
      with:
        name: retention-replay-gates-receipt-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: ignore
        path: "${{ runner.temp }}/gates-receipt/"
    - name: Require complete replay gates
      id: qualify
      if: "${{ !cancelled() }}"
      shell: bash
      env:
        LISTINGS_OUTCOME: "${{ needs.replay-listings.result }}"
        COLLECT_OUTCOME: "${{ steps.collect.outcome }}"
        MERGE_OUTCOME: "${{ steps.merge.outcome }}"
        FUNCTIONS_OUTCOME: "${{ steps.functions.outcome }}"
        INVENTORY_OUTCOME: "${{ steps.inventory.outcome }}"
        COVERAGE_OUTCOME: "${{ steps.coverage.outcome }}"
        BUILD_OUTCOME: "${{ steps.unpack.outcome }}"
      run: |
        git diff --exit-code HEAD --
        status=0
        for outcome in BUILD LISTINGS COLLECT MERGE FUNCTIONS INVENTORY COVERAGE; do
          key="${outcome}_OUTCOME"
          printf '%s: %s\n' "$outcome" "${!key}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "${!key}" != success ]]; then
            status=1
          fi
        done
        exit "$status"
    - name: Record replay comparison evidence
      id: comparison
      if: "${{ !cancelled() && steps.functions.outcome == 'success' && steps.coverage.outcome != 'skipped' }}"
      shell: bash
      run: |
        env GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
          python3 -I scripts/tests/retention_qualification.py capture --reports "$GATES/reports" \
            --out "$GATES/comparison" --attempt-dir "$GATES/inputs"
    - name: Retain replay comparison evidence
      if: "${{ !cancelled() && steps.comparison.outcome == 'success' }}"
      uses: actions/upload-artifact@v7.0.1
      with:
        name: retention-replay-comparison-${{ github.run_attempt }}
        path: "${{ env.GATES }}/comparison/"
        if-no-files-found: error
        retention-days: 7
    - name: Verify incompatible evidence and deadline diagnostics
      id: negative
      if: "${{ !cancelled() && github.run_attempt == 1 && (steps.collect.outputs.code == '0' || steps.collect.outputs.code == '1') }}"
      timeout-minutes: 10
      shell: bash
      env:
        SNAPSHOT_ID: '14179413511'
      run: |
        env GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" \
          GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
          python3 -I scripts/tests/retention_qualification.py negative \
            --inputs "$GATES/inputs" --build-manifest "$GATES/build.json" \
            --snapshot-artifact-id "$SNAPSHOT_ID" | tee -a "$GITHUB_STEP_SUMMARY"
        python3 -I scripts/tests/test_gates.py -v \
          CoverageNetTests.test_shard_settles_earlier_steps_after_work_cutoff \
          CoverageNetTests.test_raw_profile_is_merged_during_diagnostics_reserve \
          WorkflowTests.test_shard_artifact_is_uploaded_even_if_coverage_failed \
          WorkflowTests.test_seven_day_shard_diagnostics_keep_receipt_and_sanitized_logs
    needs:
    - replay-listings
    if: "${{ !cancelled() }}"
    permissions:
      actions: read
      contents: read
