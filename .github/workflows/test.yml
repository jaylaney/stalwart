name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: "0 7 * * 1"

# What this workflow can claim. It runs the tests this public repository holds,
# against the fork on upstream 1.0.3. Upstream's private test suites are not
# public, so no job here runs them and no result here says they passed. The
# external protocol suites (Dovecot imaptest, Fastmail's JMAP test suite,
# Apple's CalDAVTester) are deferred to a follow-up plan by the 1.0 upgrade
# design's scope exclusions; no job runs them either.

# A newer push to a pull request cancels that pull request's run in progress.
# Every other trigger (push to main, schedule, manual dispatch) gets a group of
# its own, keyed on the run id, so those runs never cancel or hold each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The workspace unit step's features (unit-tests job), which the gates job's
  # listing capture (scripts/tests/capture_listings.py) reads too. The tests
  # crate stays out of that build, so cargo does not unify its dev-dependency
  # features across the workspace; this list enables them by hand: the
  # test_mode and enterprise features of tests/Cargo.toml's dev-dependencies,
  # its rocks and sqlite stores, and dns-update's test_provider (common's test
  # build needs it); smtp/test_mode also turns on mail-auth's test feature.
  # Re-derived for 1.0 (the upgrade outcome note, "UNIT_TEST_FEATURES for
  # 1.0"): no 1.0 crate has coordinator, dav-proto, directory, http_proto,
  # imap, managesieve or pop3 test_mode. http's features cannot be listed
  # here (1.0's telemetry crate depends on the crates.io http crate, which
  # has no such features), so http's unit tests run in their own step. After
  # a change to tests/Cargo.toml, compare the step's `-- --list` with
  # `cargo test --workspace --lib --bins -- --list` (less the tests, scim and
  # scim-proto binaries) and update the list.
  UNIT_TEST_FEATURES: >-
    common/test_mode common/enterprise
    coordinator/enterprise
    dav/test_mode
    directory/enterprise directory/sqlite
    dns-update/test_provider
    email/test_mode email/enterprise
    groupware/test_mode
    jmap/test_mode jmap/enterprise
    managesieve/enterprise
    services/test_mode services/enterprise
    smtp/test_mode smtp/enterprise
    spam-filter/test_mode spam-filter/enterprise
    store/test_mode store/enterprise store/rocks store/sqlite
    trc/enterprise
    utils/test_mode
    vault/test_mode

jobs:
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Style
        run: cargo fmt --all --check

      # Ruling 186: the gates' step table matches this workflow, and the gate tools pass
      # their self-tests (stdlib only, no cargo).
      - name: Check Gates
        run: |
          python3 -I scripts/tests/ci_steps.py
          python3 -I scripts/tests/test_gates.py
          python3 -I scripts/tests/test_retention_artifacts.py
          python3 -I scripts/tests/test_retention_evidence.py

  test:
    name: Test
    needs: style
    # Upstream's full suite checks the paths the fork shares with ordinary
    # accounts. It runs on pull requests to main, weekly and on manual
    # dispatch (dispatch it on any branch that merges an upstream release
    # tag); a push to main skips it, since the pull request run covered the
    # same code before the merge. The timeout is generous (a healthy run takes
    # about 25 minutes) but keeps a hang from running to GitHub's 6-hour
    # default. The unit tests run in the unit-tests job and the other upstream
    # suites in the upstream-suites job, so this job stays well inside it.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # External services (OpenLDAP, Keycloak, PostgreSQL, MySQL, Redis, NATS,
      # MinIO, OpenSearch, Meilisearch) are provisioned on demand by the test
      # suite via testcontainers using the Docker daemon available on the
      # runner; see tests/src/utils/containers.rs.

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Directory Tests
        # Needs Docker: OpenLDAP and Keycloak run as testcontainers. At 1.0
        # the suite has no oidc sub-test (its file is SEL-only and was not
        # carried). The Bearer arm of the zero-access external-directory
        # refusal would need a key-account case against Keycloak here; that
        # optional case is deferred, so no step covers the Bearer arm.
        run: cargo test -p tests directory -- --nocapture

      - name: SMTP Tests
        if: ${{ !cancelled() }}
        # The antispam test fetches the spam filter rules from the URL in
        # SPAM_RULES_URL. Without it the test falls back to a file path on
        # upstream's developer machine (file:///Users/me/code/spam-filter/...),
        # the UpdateRules task fails three times and stays in the queue as
        # Failed, and the test waits for it forever. The URL pins a rules
        # release (v3.0.4); raise it deliberately. Six SMTP tests are timing-flaky
        # when the whole filter runs in parallel (dkim2_dsn_is_signed, lmtp_delivery, queue_retry,
        # manage_reports, and at 1.0 antispam and dkim2_all_disclosed) and
        # pass when rerun by name. The step reruns the
        # failed ones once, taking their names from libtest's final failures
        # list (with --nocapture the per-test FAILED lines can interleave with
        # test output). A real regression fails both runs. The explicit bash
        # shell sets pipefail, so the pipeline through tee reports cargo's
        # status.
        shell: bash
        run: |
          status=0
          cargo test -p tests smtp -- --nocapture 2>&1 | tee "$RUNNER_TEMP/smtp-tests.log" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          failed=$(awk '
            /^failures:$/ { collecting = 1; names = ""; next }
            collecting && /^    [A-Za-z_][A-Za-z0-9_:]*$/ { sub(/^    /, ""); names = names " " $0; next }
            collecting && (/^---- / || /^test result:/) { collecting = 0 }
            END { print names }
          ' "$RUNNER_TEMP/smtp-tests.log")
          if [ -z "$failed" ]; then
            echo "::error title=SMTP tests::run failed (status $status) and no failed test names were found; not retrying"
            exit "$status"
          fi
          echo "::warning title=SMTP tests::retrying once:$failed"
          # shellcheck disable=SC2086
          cargo test -p tests -- --exact --nocapture $failed
        env:
          SPAM_RULES_URL: https://github.com/stalwartlabs/spam-filter/releases/download/v3.0.4/spam-filter-rules.json.gz

      - name: IMAP Tests
        if: ${{ !cancelled() }}
        run: cargo test -p tests imap -- --nocapture

      - name: JMAP Tests
        if: ${{ !cancelled() }}
        # Upstream's calendar::notification sub-test is timing-flaky (a fixed
        # 200 ms wait); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests jmap -- --nocapture || {
            echo "::warning title=jmap::run failed; retrying once (known calendar::notification flake)"
            cargo test -p tests jmap -- --nocapture
          }

  unit-tests:
    name: Unit Tests
    needs: style
    # Every unit test of crates/* except the Enterprise-licensed scim and
    # scim-proto crates (571 passed and 2 #[ignore]d in the workspace step at
    # 1.0, 16 in the smtp step and 6 in the http step), in three steps:
    # the workspace step, then smtp without enterprise and http with its
    # test_mode, which the workspace step's features cannot select. It runs
    # on every trigger, a push to main included: it holds the fork's own unit
    # tests in common, email, http and the other crates, which no other job
    # runs, and the protocol and store unit tests. The one doctest in the
    # workspace (store, with its sqlite feature) imports r2d2_sqlite, which
    # is not a dependency, so it does not compile and has no step. The two
    # extra steps build their crates with other features, hence the longer
    # timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Unit Tests
        # UNIT_TEST_FEATURES is set at the top of this file. stalwart's
        # default features (rocks, enterprise) apply as they do in a plain
        # `cargo test --workspace`.
        run: |
          cargo test --workspace --exclude tests --exclude scim --exclude scim-proto \
            --lib --bins --features "$UNIT_TEST_FEATURES"

      - name: SMTP Unit Tests (without enterprise)
        # Upgrade ruling 53: smtp's restored DKIM tests (seven,
        # inbound::dkim::tests) build only without enterprise, since their
        # queue::Message literal cannot name the SEL-gated tenant_ids, so the
        # workspace step (smtp/enterprise) leaves them out. This build runs
        # them with the rest of smtp's unit tests. The gates' configuration
        # test.yml__unit-tests__smtp-unit-tests-without-enterprise is this
        # step; its name and command are the selection move's.
        run: cargo test -p smtp --lib --bins --features test_mode

      - name: HTTP Unit Tests
        # http's unit tests with its test_mode, which the fork's za_test
        # module needs (two tests); the workspace step cannot enable it (see
        # UNIT_TEST_FEATURES). `-p http` is ambiguous in this workspace. The
        # gates' configuration test.yml__unit-tests__http-unit-tests is this
        # step; its name and command are the selection move's.
        run: cargo test -p http@1.0.3 --lib --bins --features test_mode,enterprise

  upstream-suites:
    name: Upstream Suites
    needs: style
    # Upstream suites that the Test job does not select: system, the store
    # family (store, blob, lookup, search), telemetry, automation (ACME and
    # DNS against Docker test servers) and the webdav::cal_query tests. Same
    # triggers as the Test job: a push to main skips it, since the pull
    # request run covered the same code before the merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # External services (the ACME and PowerDNS test servers) are provisioned
      # on demand by the test suite via testcontainers using the Docker daemon
      # available on the runner; see tests/src/utils/containers.rs.

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: CalDAV Query Expansion Tests
        # The filter also lists ical_roundtrip_expansion, which is #[ignore]d
        # and so skipped.
        run: cargo test -p tests 'webdav::cal_query::' -- --nocapture

      - name: Store Tests
        if: ${{ !cancelled() }}
        run: cargo test -p tests store::store_tests -- --nocapture

      - name: Blob Tests
        if: ${{ !cancelled() }}
        run: cargo test -p tests store::blob::blob_tests -- --nocapture

      - name: Lookup Tests
        if: ${{ !cancelled() }}
        run: cargo test -p tests store::lookup::lookup_tests -- --nocapture

      - name: Search Tests
        if: ${{ !cancelled() }}
        run: cargo test -p tests store::search_tests -- --nocapture

      - name: Telemetry Tests
        if: ${{ !cancelled() }}
        run: cargo test -p tests telemetry::telemetry_tests -- --nocapture

      - name: System Tests
        if: ${{ !cancelled() }}
        # At 1.0 the SEL-only tenant and archiving sub-tests are not carried.
        run: cargo test -p tests system::system_tests -- --nocapture

      - name: Automation Tests
        if: ${{ !cancelled() }}
        # Needs Docker: ensure_acme and ensure_powerdns build and start the
        # Pebble, challtestsrv and PowerDNS test servers.
        run: cargo test -p tests automation::automation_tests -- --nocapture

  zero-access:
    name: Zero-access Test
    needs: style
    # Each suite step runs whatever the earlier steps' results (`!cancelled()`),
    # so one failure does not hide the others; the job still fails. The test
    # and upstream-suites jobs do the same.
    runs-on: ubuntu-latest
    # A default-mode retry exhausted the previous 2h budget before finishing.
    # Allow both blob modes and later suites within a finite job limit; keep
    # client deadlines, suite selection and retry counts unchanged.
    timeout-minutes: 240

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Vault and Groupware Unit Tests
        # vault's test_mode feature adds a test (the live key counter) that a
        # plain `-p vault` run does not build.
        run: cargo test -p vault -p groupware --features vault/test_mode -- --nocapture

      - name: Zero-access Leak Scanner Unit Test
        if: ${{ !cancelled() }}
        # A plain unit test of the leak scanner (tests/src/za/leak.rs) that the
        # za_tests filter below does not select.
        run: cargo test -p tests za::leak::tests::try_archive_short_values_are_not_archives -- --exact --nocapture

      - name: Zero-access Tests
        if: ${{ !cancelled() }}
        # One rerun, as the CalDAV steps have: on a hosted runner a request
        # of the suite can outlast the 500 ms client timeout of upstream's
        # DAV test helper (tests/src/utils/webdav.rs). A real regression
        # fails both runs. The test server wipes its data directory at
        # start, so the rerun starts clean.
        run: |
          cargo test -p tests za::za_tests -- --nocapture || {
            echo "::warning title=za_tests::run failed; retrying once (hosted-runner request timeout)"
            cargo test -p tests za::za_tests -- --nocapture
          }

      - name: Zero-access Tests (filesystem blob store)
        if: ${{ !cancelled() }}
        # The leak scanner reads blobs through the configured blob store;
        # this run keeps blobs outside the data store. The test server wipes
        # its data directory, blob files included, at start. One rerun, as
        # above.
        run: |
          cargo test -p tests za::za_tests -- --nocapture || {
            echo "::warning title=za_tests::filesystem-blob run failed; retrying once (hosted-runner request timeout)"
            cargo test -p tests za::za_tests -- --nocapture
          }
        env:
          BLOB_STORE: FileSystem

      - name: Zero-access Cache Swap Tests
        if: ${{ !cancelled() }}
        # New at 1.0: the za suite with the cache swap tier (upgrade ruling
        # 20). It runs without BLOB_STORE, on the default blob store.
        run: cargo test -p tests za::cache_swap::cache_swap_tests -- --exact --nocapture

      - name: CalDAV Tests (plain accounts)
        if: ${{ !cancelled() }}
        # Upstream's cal_itip sub-test is timing-flaky (DTSTAMP index
        # mismatch); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests webdav::webdav_tests -- --nocapture || {
            echo "::warning title=webdav_tests::plain-mode run failed; retrying once (known cal_itip flake)"
            cargo test -p tests webdav::webdav_tests -- --nocapture
          }

      - name: CalDAV Tests (key accounts)
        if: ${{ !cancelled() }}
        # Upstream's cal_itip sub-test is timing-flaky (DTSTAMP index
        # mismatch); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests webdav::webdav_tests -- --nocapture || {
            echo "::warning title=webdav_tests::key-mode run failed; retrying once (known cal_itip flake)"
            cargo test -p tests webdav::webdav_tests -- --nocapture
          }
        env:
          ZA_KEY_ACCOUNTS: "1"

      # Test covers these plain-mail suites on pull_request, schedule and
      # workflow_dispatch; zero-access retains them on main pushes because
      # Test skips push.
      - name: IMAP Tests (plain accounts)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        # Ordinary accounts through the mail paths this branch edits: they
        # keep upstream's behaviour (invariant 9).
        run: cargo test -p tests imap::imap_tests -- --nocapture

      - name: JMAP Tests (plain accounts)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        # Upstream's calendar::notification sub-test is timing-flaky (a fixed
        # 200 ms wait); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests jmap::jmap_tests -- --nocapture || {
            echo "::warning title=jmap_tests::plain-mode run failed; retrying once (known calendar::notification flake)"
            cargo test -p tests jmap::jmap_tests -- --nocapture
          }

      - name: IMAP Tests (key accounts)
        if: ${{ !cancelled() }}
        # Upstream's IMAP suite with its users provisioned as key accounts
        # (the admin and the groups stay plain; mail spec 11): the variants in
        # tests/src/imap/za_variants.rs assert the refusals, the rest runs
        # unchanged against sealed mail.
        run: cargo test -p tests imap::imap_tests -- --nocapture
        env:
          ZA_KEY_ACCOUNTS: "1"

      - name: JMAP Tests (key accounts)
        if: ${{ !cancelled() }}
        # The same for the JMAP suite (tests/src/jmap/za_variants.rs). Key
        # mode runs upstream's calendar bodies and the calendar variants; the
        # notification variant is a refusal, so upstream's timing-flaky
        # calendar::notification sub-test does not run here. Two upstream
        # sub-tests it does run are timing-flaky: calendar::alarm (its first
        # alert is due about a second after the create) and the thread merge
        # of the suite's ordinary accounts (a background task finishes it).
        # One rerun keeps them from failing the job. A real regression fails
        # both runs. The test server wipes its data directory at start, so
        # the rerun starts clean.
        run: |
          cargo test -p tests jmap::jmap_tests -- --nocapture || {
            echo "::warning title=jmap_tests::key-mode run failed; retrying once (known calendar::alarm and thread-merge flakes)"
            cargo test -p tests jmap::jmap_tests -- --nocapture
          }
        env:
          ZA_KEY_ACCOUNTS: "1"

  # Builds the shipping binary (RocksDB, no enterprise or test mode) once, for
  # the two jobs that test it: caldav-client and fresh-store. It starts as soon
  # as style passes, so neither job waits for a build of its own.
  product-build:
    name: Build Product
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # verify_product.py checks that the pinned upstream commit is in the
          # source's history, and that no later upstream release is.
          fetch-depth: 0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify release tooling
        run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Build product (RocksDB, no enterprise or test mode)
        run: cargo build --release --locked -p stalwart --no-default-features --features rocks

      # The release verifier (product-build.yml's), run on every CI build so a
      # release-identity break shows on the pull request, not at tag time. The
      # provenance goes outside target/, so it is not uploaded; attestation
      # stays in product-build.yml only.
      - name: Verify shipping identity
        run: |
          python3 scripts/release/verify_product.py \
            --binary target/release/stalwart \
            --source-commit "$(git rev-parse HEAD)" --ref "$GITHUB_REF" \
            --inspect-elf --output "$RUNNER_TEMP/stalwart.provenance.json"

      # An artifact upload drops the executable bit, so the binary travels in a tar archive.
      - name: Package product binary
        run: tar -C target/release -cf "$RUNNER_TEMP/stalwart-product.tar" stalwart

      - name: Upload product binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stalwart-product
          path: ${{ runner.temp }}/stalwart-product.tar
          retention-days: 1
          if-no-files-found: error

  caldav-client:
    name: Independent CalDAV Client
    needs: product-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download product binary
        uses: actions/download-artifact@v8
        with:
          name: stalwart-product
          path: ${{ runner.temp }}/product

      - name: Extract product binary
        run: tar -xf "$RUNNER_TEMP/product/stalwart-product.tar" -C "$RUNNER_TEMP/product"

      - name: Fetch pinned independent client suite
        run: |
          git clone --no-checkout https://github.com/python-caldav/caldav.git "$RUNNER_TEMP/python-caldav"
          git -C "$RUNNER_TEMP/python-caldav" checkout --detach 111ae14b875f40d100d5259820f10210f00e20f9
          python -m venv "$RUNNER_TEMP/caldav-venv"
          "$RUNNER_TEMP/caldav-venv/bin/python" -m pip install -r tests/caldav_client/requirements.txt
          "$RUNNER_TEMP/caldav-venv/bin/python" -m pip install --no-deps --no-build-isolation "$RUNNER_TEMP/python-caldav"

      - name: Check harness failure boundaries
        run: "$RUNNER_TEMP/caldav-venv/bin/python -m unittest discover -s tests/caldav_client -p test_runner.py -v"

      - name: Third-party CalDAV suites and strict scheduling flows (plain and key)
        run: |
          "$RUNNER_TEMP/caldav-venv/bin/python" tests/caldav_client/runner.py \
            --binary "$RUNNER_TEMP/product/stalwart" \
            --caldav-source "$RUNNER_TEMP/python-caldav" \
            --log-dir "$RUNNER_TEMP/caldav-client-logs"

      - name: Retain sanitized CalDAV failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: caldav-client-logs
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/caldav-client-logs/plain-server.log
            ${{ runner.temp }}/caldav-client-logs/plain-pytest.log
            ${{ runner.temp }}/caldav-client-logs/key-server.log
            ${{ runner.temp }}/caldav-client-logs/key-pytest.log

  fresh-store:
    name: Fresh OSS Store Restart
    needs: product-build
    # The shipping product (RocksDB, no enterprise or test mode), built in
    # the product-build job's own Cargo process, apart from the
    # enterprise-enabled test builds. The gate creates a fresh store, an
    # ordinary account and two key accounts, seeds mail, calendars, pins and
    # sharing through public
    # interfaces, stops the server, restarts the same binary on the same
    # store and reads everything back on new connections
    # (tests/product/fresh_store.py). Its failure tests run first; they use
    # stand-in binaries and need no build.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check gate failure boundaries
        run: python -B -m unittest discover -s tests/product -p test_fresh_store.py -v

      - name: Download product binary
        uses: actions/download-artifact@v8
        with:
          name: stalwart-product
          path: ${{ runner.temp }}/product

      - name: Extract product binary
        run: tar -xf "$RUNNER_TEMP/product/stalwart-product.tar" -C "$RUNNER_TEMP/product"

      - name: Fresh store create, restart and readback
        run: |
          python -B tests/product/fresh_store.py \
            --binary "$RUNNER_TEMP/product/stalwart" \
            --log-dir "$RUNNER_TEMP/fresh-store-logs"

      - name: Retain sanitized fresh-store failure diagnostics
        # The harness writes only these two logs, each through its exact
        # redaction of every generated credential, token and recovery key.
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fresh-store-logs
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/fresh-store-logs/server.log
            ${{ runner.temp }}/fresh-store-logs/fresh-store.log

  # Retention runs weekly and on request. First resolve the run's Rust toolchain,
  # then build one instrumented target while capturing ordinary test listings.
  # Each coverage job runs its assigned configurations sequentially in isolation,
  # then the final job validates their evidence together and applies the
  # existing inventory and coverage rules.
  gates-toolchain:
    name: Resolve Retention Toolchain
    needs: style
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust-toolchain: ${{ steps.resolve.outputs.rust-toolchain }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Rust's coverage mapping changes the measured line counts, and the retention
      # jobs share one instrumented build, so every retention job of a run installs
      # this one exact release (X.Y.Z) of the current stable, never a channel name.
      # A failed-jobs rerun keeps this job's first output, matching the reused artifacts.
      - name: Resolve the current stable Rust release
        id: resolve
        shell: bash
        run: bash scripts/tests/retention_ci_setup.sh resolve-toolchain

  gates-build:
    name: Build Retention Coverage Target
    needs:
      - style
      - gates-toolchain
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      snapshot-artifact-id: ${{ steps.snapshot.outputs.artifact-id }}
    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"
      # The exact release gates-toolchain resolved for this run (see there).
      RUSTUP_TOOLCHAIN: ${{ needs.gates-toolchain.outputs.rust-toolchain }}
      RETENTION_TIMEOUT_MINUTES: "120"
      RETENTION_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: /mnt/target
      CARGO_HOME: /mnt/retention-ci/.cargo
      CARGO_TERM_COLOR: never
      GIT_OPTIONAL_LOCKS: "0"
      GATES: /mnt/gates
      TMPDIR: /mnt/gates/tmp

    steps:
      - name: Set the work deadline and prepare retention directories
        id: prepare
        shell: bash
        run: |
          # Leave the final 12 minutes for settlement, diagnostics and bounded uploads.
          printf 'RETENTION_DEADLINE_EPOCH=%s\n' \
            "$(( $(date +%s) + (RETENTION_TIMEOUT_MINUTES - 12) * 60 ))" >> "$GITHUB_ENV"
          sudo mkdir -p "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
          sudo chown "$(id -u):$(id -g)" "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
          df -h "$GATES"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned coverage tools
        id: tools
        shell: bash
        run: bash scripts/tests/retention_ci_setup.sh install-tools instrumented

      - name: Normalize checkout mtimes
        id: normalize
        shell: bash
        run: python3 -I scripts/tests/retention_artifacts.py normalize-checkout

      - name: Compute instrumented dependency download key
        id: cache-key
        continue-on-error: true
        shell: bash
        run: |
          key=$(python3 -I scripts/tests/retention_artifacts.py cache-key --lane instrumented \
            --target-triple "$RETENTION_TARGET")
          test -n "$key"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore instrumented dependency downloads
        id: cache-restore
        if: ${{ steps.cache-key.outcome == 'success' && steps.cache-key.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/retention-ci/.cargo/registry/cache
            /mnt/retention-ci/.cargo/registry/index
            /mnt/retention-ci/.cargo/git/db
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch and materialize dependencies
        id: fetch
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
          CACHE_RESULT: ${{ steps.cache-restore.outcome }}
        run: |
          printf 'Dependency cache %s (exact hit: %s)\n' \
            "${CACHE_RESULT:-skipped}" "${CACHE_HIT:-false}" | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/tests/retention_ci_setup.sh fetch

      - name: Check room for scheduled dependency cache saves
        id: cache-budget
        if: ${{ github.event_name == 'schedule' && steps.cache-key.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tests/retention_ci_setup.sh cache-budget

      - name: Save instrumented dependency downloads
        id: cache-save
        if: ${{ github.event_name == 'schedule' && steps.cache-budget.outputs.room == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            /mnt/retention-ci/.cargo/registry/cache
            /mnt/retention-ci/.cargo/registry/index
            /mnt/retention-ci/.cargo/git/db
          key: ${{ steps.cache-key.outputs.key }}

      - name: Build instrumented targets
        id: build
        shell: bash
        run: |
          time python3 -I scripts/tests/coverage_net.py --build-only --out "$GATES/build" \
            --deadline-epoch "$RETENTION_DEADLINE_EPOCH"

      - name: Pack the build snapshot
        id: pack
        shell: bash
        run: |
          remaining=$((RETENTION_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 0
          time timeout --kill-after=30s "$remaining" \
            python3 -I scripts/tests/retention_artifacts.py pack-build \
            --manifest "$GATES/build/build.json" --target "$CARGO_TARGET_DIR" \
            --out "$GATES/snapshot.tar.zst"
          printf 'Build snapshot compressed bytes: %s; target bytes: %s\n' \
            "$(stat -c '%s' "$GATES/snapshot.tar.zst")" \
            "$(du -sb "$CARGO_TARGET_DIR" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          df -h "$GATES"

      - name: Upload the build snapshot
        id: snapshot
        timeout-minutes: 8
        uses: actions/upload-artifact@v7.0.1
        with:
          name: retention-build-${{ github.run_attempt }}
          path: ${{ env.GATES }}/snapshot.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Stage sanitized build diagnostics
        id: build-diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        run: |
          bash scripts/tests/retention_ci_setup.sh stage-logs "$GATES/build-diagnostics" \
            "$GATES/build/steps.tsv" "$GATES"/build/logs/*.log

      - name: Retain build diagnostics
        if: ${{ !cancelled() && steps.build-diagnostics.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7.0.1
        with:
          name: retention-build-diagnostics-${{ github.run_attempt }}
          path: ${{ env.GATES }}/build-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  gates-listings:
    name: Capture Retention Test Listings
    needs:
      - style
      - gates-toolchain
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    outputs:
      receipt-artifact-id: ${{ steps.receipt.outputs.artifact-id }}
    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: ${{ needs.gates-toolchain.outputs.rust-toolchain }}
      RETENTION_TIMEOUT_MINUTES: "100"
      RETENTION_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: /mnt/listing-target
      CARGO_HOME: /mnt/retention-ci/.cargo
      CARGO_TERM_COLOR: never
      GIT_OPTIONAL_LOCKS: "0"
      GATES: /mnt/gates
      TMPDIR: /mnt/gates/tmp

    steps:
      - name: Set the work deadline and prepare retention directories
        id: prepare
        shell: bash
        run: |
          # Leave the final 12 minutes for settlement, diagnostics and bounded uploads.
          printf 'RETENTION_DEADLINE_EPOCH=%s\n' \
            "$(( $(date +%s) + (RETENTION_TIMEOUT_MINUTES - 12) * 60 ))" >> "$GITHUB_ENV"
          sudo mkdir -p "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
          sudo chown "$(id -u):$(id -g)" "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
          df -h "$GATES"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned tools
        id: tools
        shell: bash
        run: bash scripts/tests/retention_ci_setup.sh install-tools ordinary

      - name: Normalize checkout mtimes
        id: normalize
        shell: bash
        run: python3 -I scripts/tests/retention_artifacts.py normalize-checkout

      - name: Compute ordinary dependency download key
        id: cache-key
        continue-on-error: true
        shell: bash
        run: |
          key=$(python3 -I scripts/tests/retention_artifacts.py cache-key --lane ordinary \
            --target-triple "$RETENTION_TARGET")
          test -n "$key"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore ordinary dependency downloads
        id: cache-restore
        if: ${{ steps.cache-key.outcome == 'success' && steps.cache-key.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/retention-ci/.cargo/registry/cache
            /mnt/retention-ci/.cargo/registry/index
            /mnt/retention-ci/.cargo/git/db
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch and materialize dependencies
        id: fetch
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
          CACHE_RESULT: ${{ steps.cache-restore.outcome }}
        run: |
          printf 'Dependency cache %s (exact hit: %s)\n' \
            "${CACHE_RESULT:-skipped}" "${CACHE_HIT:-false}" | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/tests/retention_ci_setup.sh fetch

      - name: Check room for scheduled dependency cache saves
        id: cache-budget
        if: ${{ github.event_name == 'schedule' && steps.cache-key.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tests/retention_ci_setup.sh cache-budget

      - name: Save ordinary dependency downloads
        id: cache-save
        if: ${{ github.event_name == 'schedule' && steps.cache-budget.outputs.room == 'true' }}
        continue-on-error: true
        timeout-minutes: 6
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            /mnt/retention-ci/.cargo/registry/cache
            /mnt/retention-ci/.cargo/registry/index
            /mnt/retention-ci/.cargo/git/db
          key: ${{ steps.cache-key.outputs.key }}

      - name: Capture all CI step listings
        id: capture
        shell: bash
        run: |
          time python3 -I scripts/tests/capture_listings.py --out "$GATES/listings" \
            --deadline-epoch "$RETENTION_DEADLINE_EPOCH"

      - name: Stage listing evidence
        id: stage
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python3 -I scripts/tests/retention_artifacts.py stage --kind listings \
            --producer listings --status "$CAPTURE_OUTCOME" \
            --source "$GATES/listings" --out "$GATES/evidence"

      - name: Upload listing evidence
        id: receipt
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@v7.0.1
        with:
          name: retention-listings-${{ github.run_attempt }}
          path: ${{ env.GATES }}/evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Retain sanitized listing receipt
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7.0.1
        with:
          name: retention-listings-diagnostics-${{ github.run_attempt }}
          path: ${{ env.GATES }}/evidence/receipt.json
          if-no-files-found: ignore
          retention-days: 7

  gates-short:
    name: Retention Coverage (short)
    needs:
      - gates-toolchain
      - gates-build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    uses: ./.github/workflows/test-retention-shard.yml
    with:
      shard-id: short
      snapshot-artifact-id: ${{ needs.gates-build.outputs.snapshot-artifact-id }}
      rust-toolchain: ${{ needs.gates-toolchain.outputs.rust-toolchain }}
      timeout-minutes: 170

  gates-za-rocks:
    name: Retention Coverage (za-rocks)
    needs:
      - gates-toolchain
      - gates-build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    uses: ./.github/workflows/test-retention-shard.yml
    with:
      shard-id: za-rocks
      snapshot-artifact-id: ${{ needs.gates-build.outputs.snapshot-artifact-id }}
      rust-toolchain: ${{ needs.gates-toolchain.outputs.rust-toolchain }}
      timeout-minutes: 355

  gates-za-filesystem:
    name: Retention Coverage (za-filesystem)
    needs:
      - gates-toolchain
      - gates-build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    uses: ./.github/workflows/test-retention-shard.yml
    with:
      shard-id: za-filesystem
      snapshot-artifact-id: ${{ needs.gates-build.outputs.snapshot-artifact-id }}
      rust-toolchain: ${{ needs.gates-toolchain.outputs.rust-toolchain }}
      timeout-minutes: 355

  gates:
    name: Test Retention Gates
    needs:
      - style
      - gates-toolchain
      - gates-build
      - gates-short
      - gates-za-rocks
      - gates-za-filesystem
      - gates-listings
    if: ${{ !cancelled() && needs.style.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: ${{ needs.gates-toolchain.outputs.rust-toolchain }}
      RETENTION_TIMEOUT_MINUTES: "100"
      RETENTION_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: /mnt/target
      CARGO_HOME: /mnt/retention-ci/.cargo
      CARGO_TERM_COLOR: never
      GIT_OPTIONAL_LOCKS: "0"
      GATES: /mnt/gates
      TMPDIR: /mnt/gates/tmp

    steps:
      - name: Set the work deadline and prepare retention directories
        id: prepare
        shell: bash
        run: |
          # Leave the final 12 minutes for settlement, diagnostics and bounded uploads.
          printf 'RETENTION_DEADLINE_EPOCH=%s\n' \
            "$(( $(date +%s) + (RETENTION_TIMEOUT_MINUTES - 12) * 60 ))" >> "$GITHUB_ENV"
          sudo mkdir -p "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
          sudo chown "$(id -u):$(id -g)" "$GATES" "$CARGO_TARGET_DIR" "$CARGO_HOME" "$TMPDIR"
          df -h "$GATES"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned coverage tools
        id: tools
        shell: bash
        run: bash scripts/tests/retention_ci_setup.sh install-tools instrumented

      - name: Normalize checkout mtimes
        id: normalize
        shell: bash
        run: python3 -I scripts/tests/retention_artifacts.py normalize-checkout

      - name: Validate selected artifact IDs
        id: artifact-ids
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.gates-build.outputs.snapshot-artifact-id }}
          SHORT_ID: ${{ needs.gates-short.outputs.receipt-artifact-id }}
          ZA_ROCKS_ID: ${{ needs.gates-za-rocks.outputs.receipt-artifact-id }}
          ZA_FILESYSTEM_ID: ${{ needs.gates-za-filesystem.outputs.receipt-artifact-id }}
          LISTINGS_ID: ${{ needs.gates-listings.outputs.receipt-artifact-id }}
        run: |
          remaining=$((RETENTION_DEADLINE_EPOCH - $(date +%s)))
          if (( remaining < 41 * 60 )); then
            printf '%s\n' 'Insufficient work time for the selected artifact downloads' >&2
            exit 1
          fi
          check_id() {
            if [[ "$2" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s=true\n' "$1" >> "$GITHUB_OUTPUT"
            else
              printf 'Missing or invalid %s artifact ID. Re-run all jobs if artifacts expired.\n' "$1"
              bad=1
            fi
          }
          bad=0
          check_id snapshot "$SNAPSHOT_ID"
          check_id short "$SHORT_ID"
          check_id za-rocks "$ZA_ROCKS_ID"
          check_id za-filesystem "$ZA_FILESYSTEM_ID"
          check_id listings "$LISTINGS_ID"
          exit "$bad"

      - name: Download short evidence
        id: download-short
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.artifact-ids.outputs.short == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gates-short.outputs.receipt-artifact-id }}
          path: /mnt/gates/inputs/short
          digest-mismatch: error

      - name: Download za-rocks evidence
        id: download-za-rocks
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.artifact-ids.outputs.za-rocks == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gates-za-rocks.outputs.receipt-artifact-id }}
          path: /mnt/gates/inputs/za-rocks
          digest-mismatch: error

      - name: Download za-filesystem evidence
        id: download-za-filesystem
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.artifact-ids.outputs.za-filesystem == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gates-za-filesystem.outputs.receipt-artifact-id }}
          path: /mnt/gates/inputs/za-filesystem
          digest-mismatch: error

      - name: Download listings evidence
        id: download-listings
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.artifact-ids.outputs.listings == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gates-listings.outputs.receipt-artifact-id }}
          path: /mnt/gates/inputs/listings
          digest-mismatch: error

      - name: Download the selected build snapshot
        if: >-
          ${{ !cancelled() && steps.artifact-ids.outcome == 'success' &&
          steps.artifact-ids.outputs.snapshot == 'true' &&
          steps.download-short.outcome == 'success' &&
          steps.download-za-rocks.outcome == 'success' &&
          steps.download-za-filesystem.outcome == 'success' &&
          steps.download-listings.outcome == 'success' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gates-build.outputs.snapshot-artifact-id }}
          path: /mnt/gates/snapshot
          digest-mismatch: error
        id: snapshot-download
        timeout-minutes: 20

      - name: Restore the instrumented build
        id: unpack
        if: ${{ !cancelled() && steps.snapshot-download.outcome == 'success' && steps.normalize.outcome == 'success' }}
        shell: bash
        run: |
          time bash scripts/tests/retention_ci_setup.sh within-budget \
            python3 -I scripts/tests/retention_artifacts.py unpack-build \
            --archive "$GATES/snapshot/snapshot.tar.zst" --target "$CARGO_TARGET_DIR" \
            --manifest-out "$GATES/build.json"
          printf 'Expanded build bytes: %s\n' "$(du -sb "$CARGO_TARGET_DIR" | cut -f1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          df -h "$GATES"

      - name: Compute instrumented dependency download key
        id: cache-key
        continue-on-error: true
        shell: bash
        run: |
          key=$(python3 -I scripts/tests/retention_artifacts.py cache-key --lane instrumented \
            --target-triple "$RETENTION_TARGET")
          test -n "$key"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Restore instrumented dependency downloads
        id: cache-restore
        if: ${{ steps.cache-key.outcome == 'success' && steps.cache-key.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/retention-ci/.cargo/registry/cache
            /mnt/retention-ci/.cargo/registry/index
            /mnt/retention-ci/.cargo/git/db
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch and materialize dependencies
        id: fetch
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
          CACHE_RESULT: ${{ steps.cache-restore.outcome }}
        run: |
          printf 'Dependency cache %s (exact hit: %s)\n' \
            "${CACHE_RESULT:-skipped}" "${CACHE_HIT:-false}" | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/tests/retention_ci_setup.sh fetch

      - name: Collect retention evidence
        id: collect
        if: >-
          ${{ !cancelled() && steps.unpack.outcome == 'success' &&
          steps.download-short.outcome == 'success' &&
          steps.download-za-rocks.outcome == 'success' &&
          steps.download-za-filesystem.outcome == 'success' &&
          steps.download-listings.outcome == 'success' }}
        shell: bash
        env:
          SNAPSHOT_ID: ${{ needs.gates-build.outputs.snapshot-artifact-id }}
        run: |
          status=0
          time bash scripts/tests/retention_ci_setup.sh within-budget \
            python3 -I scripts/tests/retention_artifacts.py collect \
            --inputs "$GATES/inputs" --snapshot-artifact-id "$SNAPSHOT_ID" \
            --build-manifest "$GATES/build.json" --out "$GATES/reports" || status=$?
          printf 'code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prepare sources for reports
        id: sources
        if: ${{ !cancelled() && (steps.collect.outputs.code == '0' || steps.collect.outputs.code == '1') }}
        shell: bash
        run: |
          mkdir -p "$GATES/reports/src"
          bash scripts/tests/retention_ci_setup.sh within-budget git archive HEAD tests crates | \
            bash scripts/tests/retention_ci_setup.sh within-budget tar -x -C "$GATES/reports/src"

      - name: Merge validated profiles
        id: merge
        if: ${{ !cancelled() && (steps.collect.outputs.code == '0' || steps.collect.outputs.code == '1') && steps.fetch.outcome == 'success' }}
        shell: bash
        run: |
          status=0
          time python3 -I scripts/tests/coverage_net.py --merge-only \
            --out "$GATES/reports/net" --build-manifest "$GATES/build.json" \
            --deadline-epoch "$RETENTION_DEADLINE_EPOCH" || status=$?
          label='Validated profiles without a per-step coverage export'
          if [[ -s "$GATES/reports/net/merged.json" ]]; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
            label='Profiles included in merged coverage without a per-step export'
          fi
          jq -r --arg label "$label" '.missing_exports - .missing_profiles | select(length > 0) |
            "\($label): \(join(", "))"' \
            "$GATES/reports/collection.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Executed functions
        id: functions
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        shell: bash
        run: |
          bash scripts/tests/retention_ci_setup.sh within-budget \
            python3 -I tests/qualification/tools/strict_rule.py functions \
            --exports "$GATES/reports/net/steps" --sources "$GATES/reports/src" \
            --out "$GATES/reports/functions.json" 2>&1 | tee "$GATES/reports/functions.log"

      - name: Inventory gate
        id: inventory
        if: ${{ !cancelled() && steps.functions.outcome == 'success' }}
        shell: bash
        run: |
          bash scripts/tests/retention_ci_setup.sh within-budget \
            python3 -I scripts/tests/check_test_inventory.py \
            --baseline tests/qualification/baseline-0.16.27.json \
            --dispositions tests/qualification/dispositions.json \
            --listing "$GATES/reports/listings/list" --ignored-listing "$GATES/reports/listings/ign" \
            --executed "$GATES/reports/functions.json" 2>&1 | tee "$GATES/reports/inventory.out"

      - name: Coverage gate
        id: coverage
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.merge.outputs.available == 'true' }}
        shell: bash
        run: |
          bash scripts/tests/retention_ci_setup.sh within-budget \
            python3 -I scripts/tests/check_coverage.py \
            --baseline tests/qualification/baseline-0.16.27.json \
            --dispositions tests/qualification/dispositions.json \
            --merged "$GATES/reports/net/merged.json" --sources "$GATES/reports/src" \
            --out "$GATES/reports/coverage.json" 2>&1 | tee "$GATES/reports/coverage.out"

      - name: Sanitize gate diagnostics
        id: sanitize
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        shell: bash
        run: |
          bash scripts/tests/retention_ci_setup.sh stage-logs "$RUNNER_TEMP/gates-receipt" \
            "$GATES/reports/inventory.out" "$GATES/reports/coverage.out" \
            "$GATES/reports/functions.log" "$GATES/reports/collection.json" \
            "$GATES/reports/net/logs/merged.export.log" "$GATES/reports/net/merge.json"
          grep -h "^## exit\|^# config" "$GATES"/reports/listings/list/*.txt \
            "$GATES"/reports/listings/ign/*.txt \
            > "$RUNNER_TEMP/gates-receipt/listing-exits.txt" 2>/dev/null || true

      - name: Retain sanitized gate diagnostics
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gates-receipt-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gates-receipt/

      - name: Require a complete passing retention run
        id: qualify
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TOOLCHAIN_OUTCOME: ${{ needs.gates-toolchain.result }}
          BUILD_OUTCOME: ${{ needs.gates-build.result }}
          SHORT_OUTCOME: ${{ needs.gates-short.result }}
          ZA_ROCKS_OUTCOME: ${{ needs.gates-za-rocks.result }}
          ZA_FILESYSTEM_OUTCOME: ${{ needs.gates-za-filesystem.result }}
          LISTINGS_OUTCOME: ${{ needs.gates-listings.result }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          FUNCTIONS_OUTCOME: ${{ steps.functions.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          status=0
          for outcome in TOOLCHAIN BUILD SHORT ZA_ROCKS ZA_FILESYSTEM LISTINGS COLLECT MERGE FUNCTIONS INVENTORY COVERAGE; do
            key="${outcome}_OUTCOME"
            printf '%s: %s\n' "$outcome" "${!key}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "${!key}" != success ]]; then
              status=1
            fi
          done
          exit "$status"
