name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Style
        run: cargo fmt --all --check

  test:
    name: Test
    needs: style
    # Upstream's full suite runs only when dispatched by hand; pushes and pull
    # requests to main run the style check and the zero-access job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # External services (OpenLDAP, Keycloak, PostgreSQL, MySQL, Redis, NATS,
      # MinIO, OpenSearch, Meilisearch) are provisioned on demand by the test
      # suite via testcontainers using the Docker daemon available on the
      # runner; see tests/src/utils/containers.rs.

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: JMAP Protocol Tests
        run: cargo test -p jmap_proto -- --nocapture

      - name: IMAP Protocol Tests
        run: cargo test -p imap_proto -- --nocapture

      - name: Full-text search Tests
        run: cargo test -p store -- --nocapture

      - name: Directory Tests
        run: cargo test -p tests directory -- --nocapture

      - name: SMTP Tests
        run: cargo test -p tests smtp -- --nocapture

      - name: IMAP Tests
        run: cargo test -p tests imap -- --nocapture

      - name: JMAP Tests
        run: cargo test -p tests jmap -- --nocapture

  zero-access:
    name: Zero-access Test
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Vault and Groupware Unit Tests
        run: cargo test -p vault -p groupware -- --nocapture

      - name: Zero-access Tests
        run: cargo test -p tests za::za_tests -- --nocapture

      - name: CalDAV Tests (plain accounts)
        # Upstream's cal_itip sub-test is timing-flaky (DTSTAMP index
        # mismatch); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests webdav::webdav_tests -- --nocapture || {
            echo "::warning title=webdav_tests::plain-mode run failed; retrying once (known cal_itip flake)"
            cargo test -p tests webdav::webdav_tests -- --nocapture
          }

      - name: CalDAV Tests (key accounts)
        # Upstream's cal_itip sub-test is timing-flaky (DTSTAMP index
        # mismatch); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests webdav::webdav_tests -- --nocapture || {
            echo "::warning title=webdav_tests::key-mode run failed; retrying once (known cal_itip flake)"
            cargo test -p tests webdav::webdav_tests -- --nocapture
          }
        env:
          ZA_KEY_ACCOUNTS: "1"
