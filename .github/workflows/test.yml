name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

# A newer push to a pull request cancels that pull request's run in progress.
# Every other trigger (push to main, schedule, manual dispatch) gets a group of
# its own, keyed on the run id, so those runs never cancel or hold each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Style
        run: cargo fmt --all --check

  test:
    name: Test
    needs: style
    # Upstream's full suite checks the paths the fork shares with ordinary
    # accounts. It runs on pull requests to main, weekly and on manual
    # dispatch (dispatch it on any branch that merges an upstream release
    # tag); a push to main skips it, since the pull request run covered the
    # same code before the merge. The timeout is generous (a healthy run takes
    # about 30 minutes) but keeps a hang from running to GitHub's 6-hour
    # default.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # External services (OpenLDAP, Keycloak, PostgreSQL, MySQL, Redis, NATS,
      # MinIO, OpenSearch, Meilisearch) are provisioned on demand by the test
      # suite via testcontainers using the Docker daemon available on the
      # runner; see tests/src/utils/containers.rs.

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: JMAP Protocol Tests
        run: cargo test -p jmap_proto -- --nocapture

      - name: IMAP Protocol Tests
        run: cargo test -p imap_proto -- --nocapture

      - name: Full-text search Tests
        run: cargo test -p store -- --nocapture

      - name: Directory Tests
        run: cargo test -p tests directory -- --nocapture

      - name: SMTP Tests
        # The antispam test fetches the spam filter rules from the URL in
        # SPAM_RULES_URL. Without it the test falls back to a file path on
        # upstream's developer machine (file:///Users/me/code/spam-filter/...),
        # the UpdateRules task fails three times and stays in the queue as
        # Failed, and the test waits for it forever. The URL pins a rules
        # release (v3.0.3, the latest when this was written); raise it
        # deliberately. Four SMTP tests are timing-flaky when the whole filter
        # runs in parallel (dkim2_dsn_is_signed, lmtp_delivery, queue_retry,
        # manage_reports) and pass when rerun by name. The step reruns the
        # failed ones once, taking their names from libtest's final failures
        # list (with --nocapture the per-test FAILED lines can interleave with
        # test output). A real regression fails both runs. The explicit bash
        # shell sets pipefail, so the pipeline through tee reports cargo's
        # status.
        shell: bash
        run: |
          status=0
          cargo test -p tests smtp -- --nocapture 2>&1 | tee "$RUNNER_TEMP/smtp-tests.log" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          failed=$(awk '
            /^failures:$/ { collecting = 1; names = ""; next }
            collecting && /^    [A-Za-z_][A-Za-z0-9_:]*$/ { sub(/^    /, ""); names = names " " $0; next }
            collecting && (/^---- / || /^test result:/) { collecting = 0 }
            END { print names }
          ' "$RUNNER_TEMP/smtp-tests.log")
          if [ -z "$failed" ]; then
            echo "::error title=SMTP tests::run failed (status $status) and no failed test names were found; not retrying"
            exit "$status"
          fi
          echo "::warning title=SMTP tests::retrying once:$failed"
          # shellcheck disable=SC2086
          cargo test -p tests -- --exact --nocapture $failed
        env:
          SPAM_RULES_URL: https://github.com/stalwartlabs/spam-filter/releases/download/v3.0.3/spam-filter-rules.json.gz

      - name: IMAP Tests
        run: cargo test -p tests imap -- --nocapture

      - name: JMAP Tests
        # Upstream's calendar::notification sub-test is timing-flaky (a fixed
        # 200 ms wait); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests jmap -- --nocapture || {
            echo "::warning title=jmap::run failed; retrying once (known calendar::notification flake)"
            cargo test -p tests jmap -- --nocapture
          }

  zero-access:
    name: Zero-access Test
    needs: style
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Vault and Groupware Unit Tests
        run: cargo test -p vault -p groupware -- --nocapture

      - name: Zero-access Tests
        run: cargo test -p tests za::za_tests -- --nocapture

      - name: Zero-access Tests (filesystem blob store)
        # The leak scanner reads blobs through the configured blob store;
        # this run keeps blobs outside the data store. The test server wipes
        # its data directory, blob files included, at start.
        run: cargo test -p tests za::za_tests -- --nocapture
        env:
          BLOB_STORE: FileSystem

      - name: CalDAV Tests (plain accounts)
        # Upstream's cal_itip sub-test is timing-flaky (DTSTAMP index
        # mismatch); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests webdav::webdav_tests -- --nocapture || {
            echo "::warning title=webdav_tests::plain-mode run failed; retrying once (known cal_itip flake)"
            cargo test -p tests webdav::webdav_tests -- --nocapture
          }

      - name: CalDAV Tests (key accounts)
        # Upstream's cal_itip sub-test is timing-flaky (DTSTAMP index
        # mismatch); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests webdav::webdav_tests -- --nocapture || {
            echo "::warning title=webdav_tests::key-mode run failed; retrying once (known cal_itip flake)"
            cargo test -p tests webdav::webdav_tests -- --nocapture
          }
        env:
          ZA_KEY_ACCOUNTS: "1"

      # Test covers these plain-mail suites on pull_request, schedule and
      # workflow_dispatch; zero-access retains them on main pushes because
      # Test skips push.
      - name: IMAP Tests (plain accounts)
        if: github.event_name == 'push'
        # Ordinary accounts through the mail paths this branch edits: they
        # keep upstream's behaviour (invariant 9).
        run: cargo test -p tests imap::imap_tests -- --nocapture

      - name: JMAP Tests (plain accounts)
        if: github.event_name == 'push'
        # Upstream's calendar::notification sub-test is timing-flaky (a fixed
        # 200 ms wait); one rerun keeps it from failing the job. A real
        # regression fails both runs. The test server wipes its data
        # directory at start, so the rerun starts clean.
        run: |
          cargo test -p tests jmap::jmap_tests -- --nocapture || {
            echo "::warning title=jmap_tests::plain-mode run failed; retrying once (known calendar::notification flake)"
            cargo test -p tests jmap::jmap_tests -- --nocapture
          }

      - name: IMAP Tests (key accounts)
        # Upstream's IMAP suite with its users provisioned as key accounts
        # (the admin and the groups stay plain; mail spec 11): the variants in
        # tests/src/imap/za_variants.rs assert the refusals, the rest runs
        # unchanged against sealed mail.
        run: cargo test -p tests imap::imap_tests -- --nocapture
        env:
          ZA_KEY_ACCOUNTS: "1"

      - name: JMAP Tests (key accounts)
        # The same for the JMAP suite (tests/src/jmap/za_variants.rs). Key
        # mode runs the calendar modules as refusals, so upstream's
        # timing-flaky calendar::notification sub-test does not run here.
        run: cargo test -p tests jmap::jmap_tests -- --nocapture
        env:
          ZA_KEY_ACCOUNTS: "1"

  caldav-client:
    name: Independent CalDAV Client
    # Avoid the expensive release build when the cheaper suites fail.
    needs: zero-access
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build product (RocksDB, no enterprise or test mode)
        run: cargo build --release -p stalwart --no-default-features --features rocks

      - name: Fetch pinned independent client suite
        run: |
          git clone --no-checkout https://github.com/python-caldav/caldav.git "$RUNNER_TEMP/python-caldav"
          git -C "$RUNNER_TEMP/python-caldav" checkout --detach 111ae14b875f40d100d5259820f10210f00e20f9
          python -m venv "$RUNNER_TEMP/caldav-venv"
          "$RUNNER_TEMP/caldav-venv/bin/python" -m pip install -r tests/caldav_client/requirements.txt
          "$RUNNER_TEMP/caldav-venv/bin/python" -m pip install --no-deps --no-build-isolation "$RUNNER_TEMP/python-caldav"

      - name: Check harness failure boundaries
        run: "$RUNNER_TEMP/caldav-venv/bin/python -m unittest discover -s tests/caldav_client -p test_runner.py -v"

      - name: Third-party CalDAV suites and strict scheduling flows (plain and key)
        run: |
          "$RUNNER_TEMP/caldav-venv/bin/python" tests/caldav_client/runner.py \
            --binary target/release/stalwart \
            --caldav-source "$RUNNER_TEMP/python-caldav" \
            --log-dir "$RUNNER_TEMP/caldav-client-logs"

      - name: Retain sanitized CalDAV failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: caldav-client-logs
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/caldav-client-logs/plain-server.log
            ${{ runner.temp }}/caldav-client-logs/plain-pytest.log
            ${{ runner.temp }}/caldav-client-logs/key-server.log
            ${{ runner.temp }}/caldav-client-logs/key-pytest.log
